; PHP settings for running the Laravel project locally with OSPanel's PHP 8.1 (used by start.ps1)
extension_dir="C:\OSPanel\modules\php\PHP_8.1\ext"
extension=curl
extension=fileinfo
extension=intl
extension=mbstring
